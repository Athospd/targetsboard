# One targets project per example pipeline, each with its own store, so
# they don't mix: several use the same target names. From the project
# folder, pick one and use targets and the board as usual:
#
#   Sys.setenv(TAR_CONFIG = "inst/examples/pipelines/_targets.yaml", TAR_PROJECT = "test_chain")
#   targets::tar_make()
#   targetsboard::tar_board()
#
# The project name is the file name without "targets_". Stores go to
# _targets_examples/, which git and R CMD build ignore.

and_tidymodels:
  script: inst/examples/pipelines/targets_and_tidymodels.R
  store: _targets_examples/and_tidymodels

bootstrap:
  script: inst/examples/pipelines/targets_bootstrap.R
  store: _targets_examples/bootstrap

