<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{background:#2f223d;background-image:radial-gradient(rgba(240,229,215,.13) 1.3px,transparent 1.4px);background-size:22px 22px;
  font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#f7efe4;display:flex;align-items:center;justify-content:center;gap:64px}
img{width:300px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}
h1{font-size:76px;margin:0;font-weight:800;letter-spacing:-1.5px}
.tag{font-size:30px;margin:6px 0 26px;color:#e8dccb}
.tag code,.c code{font-family:Consolas,monospace}
.tag code{color:#9fd3df}
.pills{display:flex;gap:10px;flex-wrap:wrap;max-width:640px}
.pill{font-size:17px;font-weight:600;padding:7px 15px;border-radius:999px}
.c{background:#1f1a29;border-radius:14px;padding:18px 26px;font:21px/1.7 Consolas,monospace;margin:4px 0 22px;color:#e8e2f0;
  box-shadow:0 14px 40px rgba(0,0,0,.35)}
.c .cm{color:#8f84a3}
.url{font-size:24px;color:#f2c94c;font-weight:600}
.k{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#f2c94c;font-weight:700;margin-bottom:6px}
</style></head><body><img src="../../man/figures/logo.svg"><div>
<h1>targetsboard</h1>
<div class="tag">A live board for your <code>{targets}</code> pipelines</div>
<div class="pills">
<span class="pill" style="background:#d49536;color:#3f2f11">Watch it run</span>
<span class="pill" style="background:#354823;color:#d3f0b7">Preview values</span>
<span class="pill" style="background:#78B7C5;color:#10363f">Shape the DAG</span>
<span class="pill" style="background:#C93312;color:#ffe2da">Debug errors</span>
</div></div></body></html>
